[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short
markers =
    chaos: Chaos & load tests — run with -m chaos (STAB-08 CI gate)
    benchmark: Performance benchmarks — run with -m benchmark (MEDIUM-07 baseline regression check)
    e2e_ollama: E2E tests requiring a live Ollama instance — set BRAIN_TEST_OLLAMA=1 to enable
